<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaTrack Staff Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="../PharmaTrack Global/PharmaTrack.css">
    <link rel="stylesheet" href="PharmaTrack Contents.css">
    <link rel="stylesheet" href="PharmaTrack Staff Dashboard.css">
    <link rel="icon" type="image/png" href="assets/images/logo1.png">
</head>

<body>

    <aside id="loading-screen">
        <div class="spinner"></div>
    </aside>

    <aside id="mainFrame1">
        <div class="logo"></div>
    </aside>

<!--- NAVIGATION BAR --->

    <nav>
        <button id="navbtn"><div id="navlogo"></div>PharmaTrack</button>

        <section id="navcontainer">
            <a class="currentTab"><i class="fas fa-th-large"></i>Dashboard</a>
            <a><i class="fas fa-capsules"></i>Medicines</a>
            <a><i class="fas fa-box-open"></i>Inventory</a>
            <a><i class="fas fa-shopping-cart"></i>Sales</a>
            <a><i class="fas fa-chart-line"></i>Reports</a>
            <a><i class="fas fa-user"></i>Profile</a>
            <button class="logoutbtn"><i class="fas fa-right-from-bracket"></i>Log Out</button>
        </section>
    </nav>

<!--- MAIN CONTENT --->
        
    <main>
        <section class="content">
            <h1>Dashboard</h1>
            <div id="totalInventory"></div>
            <div id="monthlyRevenue"></div>
            <div id="lowStockAlerts"></div>
            <div id="ExpiryAlerts"></div>
            <div id="salesOverview"></div>
            <div id="topSelling"></div>
            <div id="specificStockAlert"></div>
            <div id="specificExpiryAlert"></div>
        </section>
    </main>



</body>

</html>
