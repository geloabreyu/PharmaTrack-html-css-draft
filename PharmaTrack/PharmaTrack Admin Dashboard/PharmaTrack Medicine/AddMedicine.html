<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaTrack</title>
    <link rel="stylesheet" href="AddMedicine.css">
    <link rel="stylesheet" href="../../PharmaTrack Global/PharmaTrack.css">
    <link rel="stylesheet" href="../../PharmaTrack Global/PharmaTrack Contents.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" />
    <link rel="icon" type="image/png" href="../assets/images/logo1.png">
</head>
<body>

    <nav>
        <button id="navbtn"><div id="navlogo"></div>PharmaTrack</button>

        <section id="navcontainer">
            <a href="../PharmaTrack Admin Dashboard/PharmaTrack Admin Dashboard.html"><i class="fas fa-th-large"></i>Dashboard</a>
            <a href="../PharmaTrack Admin Medicines/PharmaTrack Admin Medicines.html" class="currentTab"><i class="fas fa-capsules"></i>Medicines</a>
            <a href="../PharmaTrack Admin Inventory/PharmaTrack Admin Inventory.html"><i class="fas fa-box-open"></i>Inventory</a>
            <a href="../PharmaTrack Admin Dashoard/PharmaTrack Admin Orders.html"><i class="fas fa-truck"></i>Orders</a>
            <a href="../PharmaTrack Admin Sales/PharmaTrack Admin Sales.html"><i class="fas fa-shopping-cart"></i>Sales</a>
            <a href="../PharmaTrack Admin Reports/PharmaTrack Admin Reports.html"><i class="fas fa-chart-line"></i>Reports</a>
            <a href="../PharmaTrack Admin Profile/PharmaTrack Admin Profile.html"><i class="fas fa-user"></i>Profile</a>
            <button class="logoutbtn"><i class="fas fa-right-from-bracket"></i>Log Out</button>
        </section>

    </nav>

    <main>
        <section class="content">
            <h1>Medicines</h1>

            

            <div class="medicines">
                <form class="formContainer">
                    <h2>Drug Information</h2>
                    <div class="inputMed">
                        <label>Medicine Name</label>
                        <input type="text">
                    </div>

                    <div class="inputDos">
                        <label>Dosage</label>
                        <input type="text">
                    </div>

                    <div class="inputBrand">
                        <label>Brand Name</label>
                        <input type="text">
                    </div>

                    <div class="inputBatch">
                        <label>Batch No.</label>
                        <input type="number">
                    </div>

                    <div class="inputStock">
                        <label>Stock</label>
                        <input type="number">
                    </div>

                    <div class="inputPrice">
                        <label>Price</label>
                        <input type="number">
                    </div>

                    <div class="inputValue">
                        <label>Value</label>
                        <input type="text">
                    </div>

                    <div class="inputCateg">
                        <label>Category</label>
                        <input type="text">
                    </div>

                    <div class="saveMed">
                        <button type="submit" id="saveMed">Save</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
