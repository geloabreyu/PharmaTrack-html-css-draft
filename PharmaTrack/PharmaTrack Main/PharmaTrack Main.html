<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaTrack</title>
    <link rel="stylesheet" href="PharmaTrack Main.css">
    <link rel="icon" type="image/png" href="assets/images/logo1.png">
</head>

<body>

    <aside id="loading-screen">
        <div class="spinner"></div>
    </aside>

    <aside id="mainFrame1">
        <div class="logo"></div>
    </aside>

    <header id="header">
        <div></div>
    </header>

    <main>

        <section>

            <div class="instruction">
                <h1>Sign in to your account</h1>
                <p>Select your role and enter your credentials to continue</p>
            </div>

            <div class="roles">
                <h2>Select Role</h2>
                <button class="adminbtn">Administrator</button>
                <button>Employee</button>
            </div>

            <form  class="signInForm">
                <div><!-- whitespace --></div>
                <label>Username</label>
                <input type="text" name="username" required>
                <label>Password</label>
                <input type="password" name="password" required>
                <input type="submit" value="Sign In" class="submitbtn">
            </form>
        </section>

    </main>



</body>

</html>
