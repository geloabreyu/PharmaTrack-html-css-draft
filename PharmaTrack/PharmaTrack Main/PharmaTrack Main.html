<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaTrack</title>
    <link rel="stylesheet" href="../PharmaTrack Global/PharmaTrack.css">
    <link rel="stylesheet" href="PharmaTrack Main.css">
    <link rel="icon" type="image/png" href="assets/images/logo1.png">
</head>

<body>

    <aside id="mainFrame1">
        <div class="logo"></div>
    </aside>

    <header id="header">
            <div></div>
    </header>

    <main>
        <section>
            <article class="whitespace">
            </article>

            <article class="instruction">
                <h1>Sign in to your account</h1>
                <p>Select your role and enter your credentials to continue</p>
            </article>

            <article class="roles">
                <h2>Select Role</h2>
                <button class="adminbtn">Administrator</button>
                <button>Employee</button>
            </article>

            <article>
                <form  class="signInForm">
                    <div><!-- whitespace --></div>
                    <label>Username</label>
                    <input type="text" name="username" required>
                    <label>Password</label>
                    <input type="password" name="password" required>
                    <input type="submit" value="Sign In" class="submitbtn">
                </form>
            </article>
        </section>

    </main>



</body>

</html>
